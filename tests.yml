name: Testes automatizados

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Criar arquivo .env.test
        run: |
          echo "FLASK_APP=app.py" >> .env.test
          echo "FLASK_ENV=testing" >> .env.test
          echo "FLASK_DEBUG=0" >> .env.test
          echo "SECRET_KEY=ci-test-secret-key" >> .env.test
          echo "TESTING=1" >> .env.test
          echo "WTF_CSRF_ENABLED=0" >> .env.test

      - name: Rodar os testes
        run: pytest -v --tb=short
        env:
          PYTHONPATH: .
